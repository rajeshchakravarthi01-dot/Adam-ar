<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdamBee Ticket Auditor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { width: 340px; padding: 14px; background: #0f172a; color: #f8fafc; font-size: 12px; }
    .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 12px; }
    .logo { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; color: #fbbf24; }
    .badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #1e293b; color: #94a3b8; border: 1px solid #334155; }
    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 11px; font-weight: 600; color: #cbd5e1; margin-bottom: 3px; }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 6px 8px; border-radius: 6px; background: #1e293b; border: 1px solid #475569;
      color: #f8fafc; font-size: 11px; font-family: monospace; outline: none;
    }
    input:focus { border-color: #fbbf24; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 10px; margin-bottom: 12px; }
    .card-row { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 4px; }
    .card-row:last-child { margin-bottom: 0; }
    .muted { color: #94a3b8; }
    .val { font-weight: 600; color: #e2e8f0; }
    .btn-primary {
      width: 100%; padding: 8px; background: #fbbf24; color: #0f172a; font-weight: 700; border: none;
      border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
      font-size: 12px; transition: background 0.15s;
    }
    .btn-primary:hover { background: #f59e0b; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .status-msg { margin-top: 10px; padding: 8px; border-radius: 6px; font-size: 11px; display: none; }
    .status-success { background: #064e3b; color: #6ee7b7; border: 1px solid #059669; display: block; }
    .status-error { background: #4c0519; color: #fca5a5; border: 1px solid #be123c; display: block; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <span>🐝</span>
      <span>AdamBee v2.0</span>
    </div>
    <span id="siteProfileBadge" class="badge">Detecting...</span>
  </div>

  <div class="card">
    <div class="card-row">
      <span class="muted">Active Target:</span>
      <span id="activeUrl" class="val" style="max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">—</span>
    </div>
    <div class="card-row">
      <span class="muted">Profile:</span>
      <span id="activeProfile" class="val" style="color: #38bdf8;">—</span>
    </div>
  </div>

  <div class="form-group">
    <label>AuditEQ Server Endpoint</label>
    <input type="text" id="serverUrl" placeholder="https://your-auditeq-app.run.app">
  </div>

  <div class="form-group">
    <label>AuditEQ Session Bearer Token</label>
    <input type="password" id="authToken" placeholder="Paste session token from AuditEQ">
  </div>

  <button id="captureBtn" class="btn-primary">
    <span>⚡</span>
    <span>Harvest Ticket & Ingest to AuditEQ</span>
  </button>

  <div id="statusBox" class="status-msg"></div>

  <script src="popup.js"></script>
</body>
</html>
